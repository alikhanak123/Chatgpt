<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Salah Tracker</title>
<meta name="description" content="Tick off your five daily prayers, collect stars and badges, and cheer on your Salah Buddies.">
<meta name="theme-color" content="#2E9BF0">
<link rel="manifest" href="/manifest.json">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<link rel="icon" href="/img/p-isha.png">
<link rel="apple-touch-icon" href="/img/p-isha.png">
<meta property="og:title" content="Salah Tracker">
<meta property="og:description" content="Be my Salah Buddy! Let's remind each other to pray and collect stars.">
<meta property="og:image" content="/img/p-isha.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: a live sky at the top (its colours follow the real prayer times; five beads show today's prayers),
   then one calm column of cards — the day's prayers, pet, buddies, scores, badges, calendar, months. */
:root{
  --bg:#F3F6FC; --surface:#FFFFFF; --surface-2:#F0EFF8; --ink:#22204A; --muted:#66618C; --line:#E2E0F0;
  --accent:#D93A62; --accent-dk:#AE2A4D; --accent-ink:#FFFFFF; --sun:#F5A524; --sky:#2E8BEA; --grape:#6D5BD0; --grape-dk:#5141B0;
  --ok:#0A8A7C; --ok-dk:#076B60; --ok-bg:#DDF4F0; --late:#D98200; --late-bg:#FFF1D6; --miss:#E0405A; --miss-bg:#FFE4E8; --exc:#857DB0; --exc-bg:#ECEAF6;
  --wa:#25D366; --wa-dk:#1A9E4B;
  --none:#DDDAEC;
  --shadow:0 1px 0 rgba(34,32,74,.05), 0 12px 26px -18px rgba(34,32,74,.45);
  --f-display:"Baloo 2", "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Nunito", "Segoe UI", system-ui, sans-serif;
  --r:24px;
  color-scheme:light;
  /* the sky (noon by default; data-sky on <html> switches it) */
  --sky-a:#2E9BF0; --sky-b:#7CCBFF; --sky-c:#DDF3FF; --sky-ink:#0F2148; --sky-glow:rgba(255,255,255,.45); --star-o:0;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12122A; --surface:#1C1B3A; --surface-2:#26244A; --ink:#F2F1FF; --muted:#A9A5D2; --line:#34325F;
  --accent:#FF6F8F; --accent-dk:#D24B6D; --accent-ink:#2A0A16; --sun:#FFC24D; --sky:#6DB6FF; --grape:#A493FF; --grape-dk:#7B66E6;
  --ok:#3FD2BE; --ok-dk:#1FA593; --ok-bg:#12352F; --late:#FFB84D; --late-bg:#3B2F17; --miss:#FF7A8C; --miss-bg:#43202A; --exc:#B3ACDA; --exc-bg:#2D2A4C;
  --none:#38356A;
  --shadow:0 12px 26px -16px rgba(0,0,0,.7); color-scheme:dark }}
:root[data-sky="dawn"]{--sky-a:#2B2F6B;--sky-b:#B9638F;--sky-c:#FFB38A;--sky-ink:#FFFFFF;--sky-glow:rgba(255,220,200,.35)}
:root[data-sky="morning"]{--sky-a:#4AA8EE;--sky-b:#A8DBFF;--sky-c:#FFF0C7;--sky-ink:#0F2148}
:root[data-sky="afternoon"]{--sky-a:#3A8FD6;--sky-b:#9CC8E8;--sky-c:#FFD98C;--sky-ink:#10204A}
:root[data-sky="sunset"]{--sky-a:#35256B;--sky-b:#C94F7C;--sky-c:#FF9B57;--sky-ink:#FFFFFF;--sky-glow:rgba(255,200,160,.35)}
:root[data-sky="night"]{--sky-a:#0C1033;--sky-b:#1D1B52;--sky-c:#3A2C78;--sky-ink:#FFFFFF;--sky-glow:rgba(190,180,255,.3);--star-o:1}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;font-weight:700;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:800px;margin:0 auto;padding-inline:16px;padding-block:16px 96px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);line-height:1.05;margin:0;text-wrap:balance;font-weight:800}
h2{font-size:1.5rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
img{user-select:none;-webkit-user-drag:none;max-width:100%}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.84rem;font-weight:900;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ic{width:1.6em;height:1.6em;vertical-align:-.45em}
.sec-title{display:flex;align-items:center;gap:10px}
.sec-title img{width:40px;height:40px;flex:none}

/* the sky: a live header. Colours follow the real time of day; five beads on the sun's path are today's prayers. */
.hero{position:relative;overflow:hidden;border-radius:32px;padding:18px 18px 12px;color:var(--sky-ink);
  background:linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 60%,var(--sky-c) 100%);box-shadow:var(--shadow)}
.hero h1{font-size:clamp(1.8rem,7vw,2.5rem);letter-spacing:-.01em;line-height:1}
.hero .dates{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.hero .pill{background:color-mix(in srgb, #fff 26%, transparent);border-radius:99px;padding:3px 11px;font-size:.84rem;font-weight:800}
.sky-stars{position:absolute;inset:0;pointer-events:none;opacity:var(--star-o);transition:opacity 1s;
  background-image:radial-gradient(1.6px 1.6px at 14% 22%,#fff 60%,transparent 62%),radial-gradient(1.2px 1.2px at 31% 9%,#fff 60%,transparent 62%),
  radial-gradient(1.8px 1.8px at 58% 16%,#fff 60%,transparent 62%),radial-gradient(1.2px 1.2px at 72% 34%,#fff 60%,transparent 62%),
  radial-gradient(1.5px 1.5px at 88% 12%,#fff 60%,transparent 62%),radial-gradient(1.1px 1.1px at 44% 40%,#fff 60%,transparent 62%),
  radial-gradient(1.3px 1.3px at 6% 52%,#fff 60%,transparent 62%),radial-gradient(1.4px 1.4px at 95% 48%,#fff 60%,transparent 62%);
  animation:twinkle 5s ease-in-out infinite alternate}
@keyframes twinkle{from{filter:brightness(.7)}to{filter:brightness(1.25)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(4deg)}}
.arc{position:relative;height:150px;margin:2px 6px 24px}
.arc svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.arc path{fill:none;stroke:currentColor;stroke-opacity:.5;stroke-width:2.5;stroke-dasharray:1 8;stroke-linecap:round}
.sun{position:absolute;width:30px;height:30px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(circle at 40% 38%,#FFFBE0 0,#FFD84D 55%,#FFB020 100%);box-shadow:0 0 0 7px rgba(255,214,90,.28),0 0 34px 12px rgba(255,196,60,.5)}
.sun.moon{background:transparent;box-shadow:inset -9px 3px 0 0 #FFF0B8, 0 0 30px 6px var(--sky-glow)}
.bead{position:absolute;transform:translate(-50%,-50%);border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:inherit;z-index:1}
.bead .bi{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:rgba(255,255,255,.9);box-shadow:0 0 0 3px color-mix(in srgb, #fff 40%, transparent), 0 8px 16px -8px rgba(0,0,0,.45)}
.bead .bi img{width:32px;height:32px}
.bead .bl{font-weight:900;font-size:.72rem;line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.28)}
.bead.s-p .bi,.bead.s-q .bi{box-shadow:0 0 0 3px var(--ok), 0 8px 16px -8px rgba(0,0,0,.45)}
.bead.s-l .bi{box-shadow:0 0 0 3px var(--late), 0 8px 16px -8px rgba(0,0,0,.45)}
.bead.s-e .bi{box-shadow:0 0 0 3px var(--exc), 0 8px 16px -8px rgba(0,0,0,.45)}
.bead.s-m .bi{box-shadow:0 0 0 3px var(--miss), 0 8px 16px -8px rgba(0,0,0,.45)}
.bead.s-m .bi img{opacity:.45}
.bead .bi::after{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:900;color:#fff;line-height:1}
.bead.s-p .bi::after,.bead.s-q .bi::after{content:"✓";background:var(--ok)}
.bead.s-l .bi::after{content:"✓";background:var(--late)}
.bead.is-now .bi{animation:beadglow 2.2s ease-in-out infinite}
@keyframes beadglow{0%,100%{box-shadow:0 0 0 3px #fff,0 0 0 6px color-mix(in srgb,#fff 0%,transparent),0 8px 16px -8px rgba(0,0,0,.45)}50%{box-shadow:0 0 0 3px #fff,0 0 0 10px color-mix(in srgb,#fff 35%,transparent),0 8px 16px -8px rgba(0,0,0,.45)}}
.arc-note{position:relative;text-align:center;font-weight:900;font-size:.95rem;margin-top:2px;text-shadow:0 1px 3px rgba(0,0,0,.18)}
@media (max-width:380px){.bead .bi{width:40px;height:40px}.bead .bi img{width:28px;height:28px}.arc{height:126px}}

.panel{background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.note{background:var(--surface-2);border-radius:16px;padding:10px 14px;font-size:.92rem}

/* buttons */
.btn{border:none;border-radius:16px;padding:11px 18px;font-weight:900;transition:transform .08s, box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:active{transform:translateY(3px)}
.btn img{width:24px;height:24px}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-dk)}
.btn.primary:active{box-shadow:0 1px 0 var(--accent-dk)}
.btn.approve{background:var(--ok);color:#fff;box-shadow:0 4px 0 var(--ok-dk)}
.btn.approve:active{box-shadow:0 1px 0 var(--ok-dk)}
.btn.wa{background:var(--wa);color:#fff;box-shadow:0 4px 0 var(--wa-dk)}
.btn.ghost{background:var(--surface-2);box-shadow:0 3px 0 var(--line)}
.btn.danger{background:var(--miss);color:#fff}
.btn.sm{padding:6px 13px;font-size:.88rem}
.btn.block{width:100%}
.btn:disabled{opacity:.6;cursor:default}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:.86rem;padding:4px;font-weight:800}

/* avatars */
.avatar{border-radius:50%;flex:none;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 35% 30%, #fff 0, var(--av-bg, #FFE3EE) 70%);box-shadow:inset 0 -4px 0 rgba(0,0,0,.06), 0 0 0 3px var(--surface)}
.avatar img{width:74%;height:74%;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.18))}
.av-48{width:48px;height:48px}.av-110{width:110px;height:110px}.av-88{width:88px;height:88px}
.av-btn{border:none;background:none;padding:0;border-radius:50%;position:relative}
.av-btn .edit{position:absolute;right:0;bottom:2px;background:var(--grape);color:#fff;border-radius:99px;font-size:.66rem;font-weight:900;padding:2px 8px;box-shadow:0 2px 0 var(--grape-dk)}

/* sign-in */
.auth{max-width:460px;margin:0 auto;width:100%}
.how-step{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;align-items:center}
.how-step img{width:56px;height:56px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.15))}
.how-step b{font-family:var(--f-display);font-size:1.15rem;font-weight:600}

/* games lobby */
.game-pill{background:color-mix(in srgb, var(--sun) 35%, var(--surface));animation:nudge 1.6s ease-in-out infinite;margin-right:6px}
@keyframes nudge{0%,100%{transform:none}50%{transform:scale(1.05)}}
.game-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gp{border:3px solid transparent;background:var(--surface-2);border-radius:18px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.gp img{width:46px;height:46px}
.gp b{font-family:var(--f-display);font-weight:600;font-size:1rem;line-height:1.1}
.gp span{font-size:.7rem;color:var(--muted);line-height:1.2}
.gp[aria-pressed="true"]{border-color:var(--accent);background:var(--surface)}
.friend-pick{display:flex;gap:8px;flex-wrap:wrap}
.fp{border:3px solid transparent;background:var(--surface-2);border-radius:99px;padding:4px 14px 4px 4px;display:inline-flex;align-items:center;gap:8px;font-weight:900}
.fp .avatar{width:40px;height:40px}
.fp[aria-pressed="true"]{border-color:var(--accent);background:var(--surface)}
.g-invite{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;background:color-mix(in srgb, var(--sun) 25%, var(--surface));flex-wrap:wrap}
.g-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:16px;background:var(--surface-2);flex-wrap:wrap}
.g-ic{width:36px;height:36px}

/* game screen */
body.gaming{overflow:hidden}
.game-screen{position:fixed;inset:0;z-index:15;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:14px}
.game-screen > *{width:100%;max-width:520px}
.gs-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gs-title{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:1.3rem}
.gs-title img{width:34px;height:34px}
.gs-players{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.gs-player{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);border:3px solid transparent;min-width:0}
.gs-player b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gs-player.active{border-color:var(--ok)}
.gs-score{font-family:var(--f-display);font-size:1.4rem;line-height:1}
.gs-vs{font-family:var(--f-display);font-weight:700;color:var(--accent);font-size:1.2rem}
.gs-status{text-align:center;font-family:var(--f-display);font-weight:600;font-size:1.3rem}
.gs-status.go{color:var(--ok)}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px!important;aspect-ratio:1}
.ttt-cell{background:var(--surface);border:none;border-radius:20px;box-shadow:0 5px 0 var(--line);display:grid;place-items:center;padding:12%}
.ttt-cell img{width:100%;height:100%;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.ttt-cell.win{background:var(--ok-bg);box-shadow:0 5px 0 var(--ok)}
.ttt-cell:disabled{cursor:default}
.c4-wrap{display:flex;flex-direction:column;gap:8px;align-items:center}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--sky);padding:8px;border-radius:20px;width:100%;max-width:440px;box-shadow:0 6px 0 color-mix(in srgb, var(--sky) 60%, #000)}
.c4-col{border:none;background:transparent;padding:0;display:grid;grid-template-rows:repeat(6,1fr);gap:4px;border-radius:12px}
.c4-col:not(:disabled):hover{background:rgba(255,255,255,.18)}
.c4-col:disabled{cursor:default}
.c4-slot{aspect-ratio:1;border-radius:50%;background:var(--bg);display:grid;place-items:center;overflow:hidden}
.c4-disc{width:100%;height:100%;animation:drop .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes drop{from{transform:translateY(-300%)}to{transform:none}}
.hockey-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.hockey{touch-action:none;border-radius:22px;box-shadow:var(--shadow);background:var(--surface-2);max-width:100%}

/* prayer times, rakats, approvals */
.next-bar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:18px;background:color-mix(in srgb, var(--sky) 14%, var(--surface));flex-wrap:wrap}
.next-bar img{width:40px;height:40px;flex:none}
.next-bar b{font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.rk-chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.rk{font-size:.7rem;font-weight:900;padding:2px 8px;border-radius:99px;white-space:nowrap}
.rk-fard{background:var(--accent);color:#fff}
.rk-wajib{background:var(--grape);color:#fff}
.rk-sunnah{background:color-mix(in srgb, var(--sky) 22%, var(--surface));color:var(--sky)}
.rk-opt{background:var(--surface);color:var(--muted);border:1.5px dashed var(--line)}
.now-chip,.ok-chip{font-family:var(--f-body);font-size:.66rem;font-weight:900;padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:3px}
.now-chip{background:var(--ok);color:#fff;animation:nudge 1.6s ease-in-out infinite;display:inline-block}
.ok-chip{background:var(--ok-bg);color:var(--ok)}
.prayer.is-now{border-color:var(--ok);border-style:dashed}
.tick .opens{color:var(--muted);font-size:.66rem}
.tick:disabled .opens{opacity:1}
.bday-pill{background:color-mix(in srgb, var(--accent) 18%, var(--surface));margin-right:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.av-groups{display:flex;flex-direction:column;gap:8px}
.field input[type="date"]{min-height:46px}

/* admin */
.admin-stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))!important}
.admin-tbl{width:100%;border-collapse:collapse;font-size:.88rem;min-width:820px}
.admin-tbl th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px}
.admin-tbl td{padding:8px 6px;border-top:2px solid var(--surface-2);vertical-align:middle}
.admin-tbl tr.paused{opacity:.5}
.ad-q{font:inherit;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;width:240px;max-width:100%}
.uidbox{display:block;padding:10px;border-radius:12px;background:var(--surface-2);font-size:1rem;word-break:break-all;user-select:all}
#ad-ppin{font:inherit;padding:6px 10px;border-radius:12px;border:2px solid var(--line);width:110px;background:var(--bg);color:var(--ink)}

/* streak look on profile pictures */
.avatar.streak{animation:streak-glow 1.8s ease-in-out infinite}
.avatar.s-fire{--glow:#FF8A00;--glow2:#FF5C8A}
.avatar.s-super{--glow:#7C5CFF;--glow2:#3E9BFF}
.avatar.s-gold{--glow:#FFC23C;--glow2:#FFE58A}
@keyframes streak-glow{0%,100%{box-shadow:0 0 0 3px var(--glow), 0 0 10px 3px color-mix(in srgb, var(--glow2) 70%, transparent)}50%{box-shadow:0 0 0 4px var(--glow2), 0 0 18px 6px color-mix(in srgb, var(--glow) 75%, transparent)}}
.avatar .flame{position:absolute;right:-6%;bottom:-6%;display:flex;align-items:center;gap:1px;background:var(--surface);border-radius:99px;padding:1px 6px 1px 2px;box-shadow:0 2px 6px rgba(0,0,0,.25);font-size:.72rem;line-height:1;z-index:2}
.avatar .flame img{width:18px!important;height:18px!important;filter:none;animation:flicker .9s ease-in-out infinite alternate}
.avatar .flame b{font-family:var(--f-display);color:var(--glow)}
.av-36 .flame,.av-48 .flame,.av-pick .flame{transform:scale(.8);transform-origin:bottom right;right:-12%}
.av-110 .flame,.av-88 .flame{font-size:1rem;padding:2px 9px 2px 3px}
.av-110 .flame img,.av-88 .flame img{width:26px!important;height:26px!important}
@keyframes flicker{from{transform:scale(1) rotate(-6deg)}to{transform:scale(1.15) rotate(6deg)}}
@media (prefers-reduced-motion:reduce){.avatar.streak{box-shadow:0 0 0 3px var(--glow)}}

.streak-pill{background:linear-gradient(90deg, color-mix(in srgb, #FF8A00 25%, var(--surface)), color-mix(in srgb, var(--accent) 18%, var(--surface)));margin-right:6px}

/* new badge pop-up, buddy profile */
.new-badge h2{font-size:1.9rem}
.nb-glow{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle, color-mix(in srgb, var(--sun) 55%, transparent) 0, transparent 70%);animation:glow 1.6s ease-in-out infinite}
.nb-img{width:120px;height:120px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25));animation:pop .7s cubic-bezier(.2,1.6,.4,1), spin-in .9s ease-out}
@keyframes glow{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes spin-in{from{rotate:-200deg}to{rotate:0deg}}
.rrow{cursor:pointer;transition:transform .12s}
.rrow:hover{transform:translateX(3px)}
.buddy-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.buddy-stats > div{background:var(--surface-2);border-radius:16px;padding:8px 4px;text-align:center;display:flex;flex-direction:column}
.buddy-stats b{font-family:var(--f-display);font-size:1.25rem;line-height:1.1}
.buddy-stats span{font-size:.7rem;color:var(--muted);font-weight:800}
.buddy-card .badges{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.modal:has(.buddy-card){max-width:520px}

/* pet */
.pet-stage{position:relative;display:flex;flex-direction:column;gap:6px}
.pet-bubble{align-self:center;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:6px 14px;font-weight:900;font-size:.9rem;text-align:center;position:relative;max-width:92%;box-shadow:0 3px 0 var(--line)}
.pet-bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.pet-home{position:relative;height:230px;border-radius:24px;overflow:hidden;background:linear-gradient(180deg, var(--sky-b) 0, var(--sky-c) 68%, var(--ground) 68% 100%);box-shadow:inset 0 -6px 0 rgba(0,0,0,.06)}
.pet-home.small{height:120px;width:160px;border-radius:18px;flex:none}
@media (prefers-color-scheme: dark){.pet-home{filter:brightness(.85) saturate(.9)}}
.pet-home .deco{position:absolute;pointer-events:none}
.pet-home .c1{width:70px;top:14px;left:8%;opacity:.9;animation:drift 18s linear infinite}
.pet-home .c2{width:50px;top:38px;right:10%;opacity:.8;animation:drift 24s linear infinite reverse}
.pet-home .bf{width:34px;top:30%;left:60%;animation:flutter 6s ease-in-out infinite}
.pet-home .sp{width:40px;top:12px;right:30%;animation:float 3s ease-in-out infinite}
.pet-home.small .c1,.pet-home.small .c2{width:34px}
:root[data-sky="night"] .pet-home .c1,:root[data-sky="night"] .pet-home .c2{opacity:.25}
.pet-home.small .bf,.pet-home.small .sp{display:none}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(40px)}}
@keyframes flutter{0%,100%{transform:translate(0,0) rotate(-8deg)}25%{transform:translate(40px,-20px) rotate(8deg)}50%{transform:translate(-30px,-35px) rotate(-6deg)}75%{transform:translate(-50px,5px) rotate(6deg)}}
.pet-walker{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);transition:left 1.6s ease-in-out;cursor:pointer;outline:none}
.pet-home.small .pet-walker{bottom:8%}
.pet-body{position:relative;transform:scale(var(--s,1));transform-origin:bottom center;animation:idle 2.4s ease-in-out infinite}
.pet-img{width:120px;height:120px;display:block;filter:drop-shadow(0 10px 8px rgba(0,0,0,.18));transition:transform .2s}
.pet-home.small .pet-img{width:72px;height:72px}
.pet-body.face-right .pet-img{transform:scaleX(-1)}
.pet-walker.walking .pet-body{animation:hop .4s ease-in-out infinite}
.pet-body.is-plant{animation:sway 3s ease-in-out infinite;transform-origin:bottom center}
.pet-body.mood-sleepy{animation:breathe 3.5s ease-in-out infinite;filter:saturate(.75)}
.pet-body.mood-super .pet-img{filter:drop-shadow(0 0 14px rgba(255,194,60,.9)) drop-shadow(0 10px 8px rgba(0,0,0,.15))}
.pet-body.jump{animation:petjump .6s cubic-bezier(.2,1.6,.4,1)!important}
.pet-acc{position:absolute;pointer-events:none}
.pet-acc.ribbon{width:38%;top:-4%;right:6%;rotate:18deg}
.pet-acc.crown{width:42%;top:-24%;left:29%;animation:float 2.4s ease-in-out infinite}
.pet-zzz{position:absolute;width:40px;top:-30px;right:-20px;animation:float 2.2s ease-in-out infinite}
.pet-heart{position:absolute;bottom:35%;width:30px;pointer-events:none;animation:heartup 1.4s ease-out forwards}
@keyframes idle{0%,100%{transform:scale(var(--s,1)) translateY(0)}50%{transform:scale(var(--s,1)) translateY(-4px)}}
@keyframes hop{0%,100%{transform:scale(var(--s,1)) translateY(0) rotate(-3deg)}50%{transform:scale(var(--s,1)) translateY(-12px) rotate(3deg)}}
@keyframes sway{0%,100%{transform:scale(var(--s,1)) rotate(-4deg)}50%{transform:scale(var(--s,1)) rotate(4deg)}}
@keyframes breathe{0%,100%{transform:scale(var(--s,1))}50%{transform:scale(calc(var(--s,1)*1.04),calc(var(--s,1)*.96))}}
@keyframes petjump{0%{transform:scale(var(--s,1)) translateY(0)}35%{transform:scale(calc(var(--s,1)*1.12)) translateY(-40px) rotate(-8deg)}70%{transform:scale(var(--s,1)) translateY(0) rotate(4deg)}100%{transform:scale(var(--s,1))}}
@keyframes heartup{from{transform:translate(0,0) scale(.4);opacity:0}20%{opacity:1}to{transform:translate(var(--dx,0),-130px) scale(1.1);opacity:0}}
.pet-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pp{border:3px solid transparent;background:var(--surface-2);border-radius:18px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.pp img{width:58px;height:58px}
.pp b{font-family:var(--f-display);font-weight:600}
.pp span{font-size:.68rem;color:var(--muted)}
.pp[aria-pressed="true"]{border-color:var(--accent);background:var(--surface)}
.buddy-pet{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:18px;padding:8px}
.buddy-pet b{font-family:var(--f-display);font-size:1.2rem}
.pet-lvl{color:var(--ok)}

/* 3D pet */
.pet-home.pet-3d{height:270px}
.pet-home.pet-3d.small{height:150px;width:190px}
.pet3d{position:absolute;inset:0;cursor:pointer}
.pet3d canvas{width:100%!important;height:100%!important;display:block}
.pet-zzz3d{position:absolute;width:44px;top:22%;left:56%;animation:float 2.2s ease-in-out infinite;pointer-events:none}
.pet-3d .pet-heart{z-index:2}

.pet-credit{font-size:.66rem;color:var(--muted);opacity:.8}

/* nudges & parent messages */
.msg-btn{position:relative;padding:6px 10px}
.msg-btn.has-new{background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-dk);animation:nudge 1.4s ease-in-out infinite}
.letter-pill{background:color-mix(in srgb, var(--accent) 16%, var(--surface));margin-right:6px;border:none}
.parent-note{font-family:var(--f-display);font-size:1.3rem;font-weight:600;line-height:1.35;max-width:32ch}
textarea{font:inherit;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;resize:vertical}
.sticker-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sticker{display:flex;align-items:center;gap:8px;border:none;background:var(--surface-2);border-radius:16px;padding:8px;text-align:left;font-weight:800;font-size:.82rem;box-shadow:0 3px 0 var(--line)}
.sticker img{width:36px;height:36px;flex:none}
.sticker:active,.emoji-btn:active{transform:translateY(2px)}
.emoji-row{display:flex;gap:6px;flex-wrap:wrap}
.emoji-btn{border:none;background:var(--surface-2);border-radius:50%;width:52px;height:52px;display:grid;place-items:center;box-shadow:0 3px 0 var(--line)}
.emoji-btn img{width:36px;height:36px}
.emoji-btn:hover img{animation:pop .4s}
.nudge-btn{border:none;background:var(--surface);border-radius:50%;width:30px;height:30px;padding:3px;margin-left:6px;vertical-align:middle;box-shadow:0 2px 0 var(--line)}
.nudge-btn img{width:22px;height:22px}
.nudge-pop{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;width:min(360px, calc(100% - 32px));background:var(--surface);border-radius:26px;padding:16px;box-shadow:0 20px 50px -10px rgba(40,20,90,.5);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;overflow:hidden;animation:nudgein .5s cubic-bezier(.2,1.5,.4,1)}
.np-from{display:flex;align-items:center;gap:8px;font-weight:800}
.np-sticker{width:96px;height:96px;animation:pop .6s cubic-bezier(.2,1.6,.4,1), wiggle 1.2s .6s ease-in-out infinite}
.np-text{font-family:var(--f-display);font-weight:600;font-size:1.25rem}
.np-rain{position:absolute;top:-30px;width:26px;opacity:.85;animation:rain 2.2s ease-in forwards;pointer-events:none}
@keyframes nudgein{from{transform:translate(-50%,120%)}to{transform:translate(-50%,0)}}
@keyframes wiggle{0%,100%{rotate:-6deg}50%{rotate:6deg}}
@keyframes rain{to{transform:translateY(260px) rotate(200deg);opacity:0}}

/* Chess */
.chess-wrap{width:100%;max-width:480px}
.chess{display:grid;grid-template-columns:repeat(8,1fr);border-radius:16px;overflow:hidden;box-shadow:0 6px 0 #7a5a3a, var(--shadow);border:4px solid #8d6a45}
.cs{aspect-ratio:1;border:none;padding:0;display:grid;place-items:center;position:relative;font-size:clamp(1.5rem,8.5vw,2.6rem);line-height:1;cursor:pointer}
.cs.lt{background:#F3E3C3}.cs.dk{background:#C29A6B}
.cs.sel{background:#F7D46B!important}
.cs.last{box-shadow:inset 0 0 0 4px rgba(124,92,255,.45)}
.cs.tgt::after{content:"";width:28%;height:28%;border-radius:50%;background:rgba(23,163,95,.6);position:absolute}
.cs.cap{box-shadow:inset 0 0 0 5px rgba(235,71,96,.75)}
.cs.chk{background:radial-gradient(circle, #FF7A8C 0, #EB4760 70%)!important}
.pc{position:relative;z-index:1;user-select:none}
.pc.w{color:#fff;text-shadow:0 0 1px #2A2147, 0 0 1px #2A2147, 0 2px 0 #2A2147, 1px 0 0 #2A2147, -1px 0 0 #2A2147, 0 -1px 0 #2A2147}
.pc.b{color:#2A2147;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.cs .rk,.cs .fl{position:absolute;font-style:normal;font-size:.55rem;font-weight:900;color:rgba(42,33,71,.55)}
.cs .rk{left:3px;top:2px}.cs .fl{right:3px;bottom:1px}
.lvl-chip{font-size:.75rem;font-weight:900;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--grape);min-width:70px;text-align:center}
.dice-big{width:52px;height:52px;border-radius:12px;background:var(--surface);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.6rem;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}

/* Memory Match */
.mem-wrap{display:flex;flex-direction:column;gap:10px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;margin:0 auto;width:100%}
.mem-card{aspect-ratio:1;border:none;border-radius:16px;background:linear-gradient(135deg,var(--grape),var(--accent));box-shadow:0 4px 0 var(--grape-dk);display:grid;place-items:center;padding:14%;transition:transform .25s}
.mem-card .mem-back{width:60%;height:60%;opacity:.85}
.mem-card.up{background:var(--surface);box-shadow:0 4px 0 var(--line);animation:flip .3s ease-out}
.mem-card.up img{width:100%;height:100%}
.mem-card.got.mine{outline:3px solid var(--accent)}
.mem-card.got.theirs{outline:3px solid var(--sky);opacity:.85}
.mem-card:disabled{cursor:default}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}

/* Snakes & Ladders */
.sl-players{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.sl-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dice{width:52px;height:52px;border-radius:12px;background:var(--surface);box-shadow:0 4px 0 var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:7px;gap:2px;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.dice span{border-radius:50%}
.dice span.pip{background:var(--ink)}
.dice.empty{animation:none;opacity:.5}
.sl-wrap{width:100%;max-width:520px;margin:0 auto}
.sl-board{position:relative;width:100%;aspect-ratio:1;border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.sl-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr)}
.sl-cell{background:color-mix(in srgb, var(--sun) 22%, var(--surface));font-size:.6rem;font-weight:900;color:var(--muted);padding:2px 3px}
.sl-cell.alt{background:color-mix(in srgb, var(--sky) 18%, var(--surface))}
.sl-cell.goal{background:var(--sun);color:#5a3b00}
.sl-art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sl-token{position:absolute;width:9%;aspect-ratio:1;transform:translate(-50%,-50%);transition:left .6s ease, top .6s ease;border:3px solid;border-radius:50%;background:var(--surface)}
.sl-token .avatar{width:100%!important;height:100%!important;box-shadow:none}

/* ticks, time bar, bonus prayers, all-kids ranking */
.ticks{font-family:var(--f-body);font-size:.95rem;font-weight:900;margin-left:8px;letter-spacing:-.18em;color:var(--muted);vertical-align:1px}
.ticks.ok{color:var(--ok)}
.tbar-wrap{display:flex;flex-direction:column;gap:4px;margin:6px 0 4px}
.tbar{height:14px;border-radius:99px;background:var(--surface);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.1)}
.tbar i{display:block;height:100%;border-radius:99px;transition:width .8s, background .8s;background-image:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 60%)}
.bonus-wrap{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:20px;background:linear-gradient(135deg, color-mix(in srgb, var(--grape) 12%, var(--surface)), color-mix(in srgb, var(--sun) 14%, var(--surface)))}
.bonus-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.bonus-grid{grid-template-columns:1fr}}
.bonus-card{display:flex;align-items:center;gap:10px;padding:10px;border-radius:18px;background:var(--surface);border:3px solid transparent}
.bonus-card.done{border-color:var(--grape)}
.bonus-card .b-ic{width:44px;height:44px;flex:none}
.bonus-card b{font-family:var(--f-display);font-weight:700;font-size:1.15rem}
.rk-bonus{background:var(--sun);color:#5a3b00}
.tick.tick-sm{width:58px;height:58px}
.tick.tick-sm img{width:38px;height:38px}
.allkids{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:linear-gradient(135deg, color-mix(in srgb, var(--sky) 18%, var(--surface)), color-mix(in srgb, var(--grape) 14%, var(--surface)))}
.allkids > img{width:48px;height:48px;flex:none}
.allkids b{font-family:var(--f-display);font-weight:600;font-size:1.1rem;display:block}
.allkids-big{font-family:var(--f-display);font-weight:700;font-size:1.3rem;color:var(--grape);white-space:nowrap}
.world-pill{background:color-mix(in srgb, var(--sky) 20%, var(--surface));margin-right:6px}
.say-line .ar{font-family:"Amiri","Scheherazade New","Traditional Arabic",serif;font-size:1.55rem;line-height:2;text-align:right;color:var(--ink);font-weight:400}
.bonus-steps{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.guide-tabs{grid-template-columns:repeat(4,1fr)!important}

/* How to pray: corner button + guide */
#guide-fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;align-items:center;gap:8px;border:none;border-radius:99px;padding:8px 16px 8px 8px;
  background:var(--grape);color:#fff;font-weight:900;box-shadow:0 5px 0 var(--grape-dk), 0 10px 24px -8px rgba(60,40,120,.5)}
#guide-fab img{width:36px;height:36px;background:#fff;border-radius:50%;padding:3px}
#guide-fab:active{transform:translateY(3px);box-shadow:0 2px 0 var(--grape-dk)}
body.gaming #guide-fab{display:none}
@media (max-width:480px){#guide-fab span{display:none}#guide-fab{padding:8px}}
.guide-screen{z-index:16}
.guide-tabs{grid-template-columns:repeat(3,1fr)}
.guide-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.guide-steps li{display:grid;grid-template-columns:30px 44px minmax(0,1fr);gap:10px;align-items:start;background:var(--surface);border-radius:20px;padding:12px;box-shadow:var(--shadow)}
.guide-steps .gnum{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.guide-steps img{width:44px;height:44px}
.guide-steps b{font-family:var(--f-display);font-weight:600;font-size:1.15rem}
.guide-steps p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.say-card{background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.say-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.say-head b{font-family:var(--f-display);font-weight:700;font-size:1.2rem;color:var(--grape)}
.say-head span{font-size:.78rem;color:var(--muted)}
.say-line{padding:8px 10px;border-radius:14px;background:var(--surface-2)}
.say-line .tr{font-weight:900;font-size:1.02rem}
.say-line .en{color:var(--muted);font-size:.86rem;font-weight:700}
.rk-row{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border-radius:20px;padding:12px;box-shadow:var(--shadow)}
.rk-row img{width:48px;height:48px}
.rk-row b{font-family:var(--f-display);font-size:1.2rem}

/* laptop / desktop: wider page, two columns */
@media (min-width:1024px){
  .wrap{max-width:1280px;padding-inline:32px;gap:22px}
  .hero{padding:24px 32px 14px}
  .hero h1{font-size:2.8rem}
  .arc{height:170px;margin-inline:12%}
  .bead .bi{width:54px;height:54px}.bead .bi img{width:38px;height:38px}.bead .bl{font-size:.8rem}
  .cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:start}
  .col{display:flex;flex-direction:column;gap:22px;min-width:0}
  .side .scores{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .side .score{padding:14px}
  .side .score .grade{font-size:1.2rem}
  .side .score .grade img{width:32px;height:32px}
  .side .badges{grid-template-columns:repeat(4,minmax(0,1fr))}
  .auth-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px);gap:28px;align-items:start;max-width:1040px;margin:0 auto;width:100%}
  .auth-cols .intro{padding:30px}
  .auth-cols .auth{max-width:none}
  .intro h2{font-size:1.9rem}
}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:18px;padding:4px;gap:4px}
.tabs button{border:none;background:transparent;border-radius:14px;padding:10px;font-weight:900;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.invite-banner{display:flex;gap:12px;align-items:center;background:color-mix(in srgb, var(--sun) 25%, var(--surface));border-radius:18px;padding:12px 14px}
.invite-banner img{width:46px;height:46px;flex:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-weight:900;font-size:.92rem}
.field .hint{font-size:.8rem;color:var(--muted)}
.field input{font:inherit;padding:11px 13px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.at{position:relative}
.at span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:900}
.at input{padding-left:30px}
.pin-input{letter-spacing:.6em;text-align:center;font-size:1.6rem!important;font-family:var(--f-display)!important}
.grownup{border:2px dashed var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.err{color:var(--miss);font-weight:900;font-size:.9rem;min-height:1.2em}

/* kid hero */
.kid-hero{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:16px;row-gap:6px;align-items:center}
.kid-hero > :first-child{grid-row:span 2}
.kid-hero > div:last-child{display:contents}
.kid-hero .hello{align-self:end}.kid-hero .uname{align-self:start}
.kid-hero .rank-pill,.kid-hero > div > .linkbtn,.kid-hero > div > .small{grid-column:1 / -1;justify-self:start;margin-top:0}
.toolbar{row-gap:4px;column-gap:6px}
@media (max-width:480px){.panel{padding:16px}.toolbar .btn.sm{padding:6px 10px}.toolbar .msg-btn{padding:6px 8px}.toolbar{column-gap:4px}}
.hello{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,6vw,2.2rem);line-height:1.05;overflow-wrap:anywhere}
.uname{color:var(--muted);font-weight:900}
.rank-pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:99px;padding:3px 12px 3px 4px;font-weight:900;font-size:.9rem;margin-top:6px;border:none}
.rank-pill img{width:28px;height:28px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:480px){.kid-hero .av-110{width:84px;height:84px}}

/* today */
.today-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.stars{display:flex;gap:4px}
.stars img{width:38px;height:38px;transition:transform .35s cubic-bezier(.2,1.6,.4,1), filter .3s}
.stars img.off{filter:grayscale(1) opacity(.28)}
.stars img.on{transform:scale(1.1)}
.progress-msg{font-family:var(--f-display);font-weight:600;font-size:1.2rem}
.prayers{display:flex;flex-direction:column;gap:12px}
.prayer{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 14px;border-radius:20px;background:var(--surface-2);border:2px solid transparent;transition:background .2s,border-color .2s}
.prayer.s-p{background:var(--ok-bg);border-color:var(--ok)}
.prayer.s-l{background:var(--late-bg);border-color:var(--late)}
.prayer.s-m{background:var(--miss-bg);border-color:var(--miss)}
.prayer.s-e{background:var(--exc-bg);border-color:var(--exc)}
.picon{width:60px;height:60px;border-radius:18px;background:var(--surface);display:grid;place-items:center;box-shadow:0 3px 0 var(--line)}
.picon img{width:44px;height:44px}
.pname b{font-family:var(--f-display);font-size:1.4rem;font-weight:700;display:block;line-height:1.05}
.pname .sub{font-size:.85rem;color:var(--muted);font-weight:800}
.others{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.mini{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-weight:900;font-size:.76rem;color:var(--muted)}
.mini:hover{border-color:var(--ink);color:var(--ink)}
.mini[aria-pressed="true"].c-l{background:var(--late);border-color:var(--late);color:#fff}
.mini[aria-pressed="true"].c-m{background:var(--miss);border-color:var(--miss);color:#fff}
.mini[aria-pressed="true"].c-e{background:var(--exc);border-color:var(--exc);color:#fff}
.qaza-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:7px}
.mini.c-q{border-color:var(--grape);color:var(--grape)}
.mini.c-q:hover{background:var(--grape);color:#fff}
.mini.c-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.qchip{font-size:.74rem;font-weight:900;padding:3px 10px;border-radius:99px}
.qchip.pending{background:var(--surface);color:var(--grape);border:2px dashed var(--grape)}
.qchip.ok{background:var(--grape);color:#fff}
.prayer.s-q{background:color-mix(in srgb, var(--grape) 14%, var(--surface));border-color:var(--grape)}
.prayer.s-qp{border-style:dashed;border-color:var(--grape)}
.tick{width:70px;height:70px;border-radius:50%;border:3px dashed var(--ok);background:var(--surface);display:grid;place-items:center;font-weight:900;font-size:.7rem;color:var(--ok);line-height:1.1;text-align:center;transition:transform .12s}
.tick:hover{transform:scale(1.06)}
.tick:active{transform:scale(.9)}
.tick img{width:46px;height:46px}
.tick[aria-pressed="true"]{background:var(--ok-bg);border:3px solid var(--ok);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.5) rotate(-20deg)}100%{transform:scale(1) rotate(0)}}
.tick:disabled,.mini:disabled{opacity:.5;cursor:default}
@media (max-width:480px){.prayer{gap:10px;padding:10px}.picon{width:48px;height:48px}.picon img{width:36px;height:36px}.tick{width:60px;height:60px}.tick img{width:40px;height:40px}}
.stamp{display:flex;align-items:center;gap:8px;font-weight:900;font-size:.92rem;color:var(--ok);background:var(--ok-bg);border-radius:16px;padding:8px 12px}
.stamp img{width:28px;height:28px;flex:none}

/* race */
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px}
.seg button{border:none;background:transparent;border-radius:999px;padding:6px 14px;font-weight:900;font-size:.86rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.race{display:flex;flex-direction:column;gap:10px}
.rrow{display:grid;grid-template-columns:44px 48px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:20px;background:var(--surface-2)}
.rrow.me{background:color-mix(in srgb, var(--accent) 14%, var(--surface));outline:3px solid var(--accent)}
.rank{width:44px;height:44px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.2rem;color:var(--muted)}
.rank img{width:44px;height:44px}
.rname{font-family:var(--f-display);font-weight:700;font-size:1.1rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rname .you{background:var(--accent);color:#fff;font-family:var(--f-body);font-size:.68rem;font-weight:900;padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:2px}
.rname .rm{margin-left:6px;font-family:var(--f-body);font-size:.72rem}
.track{height:14px;border-radius:99px;background:var(--surface);overflow:hidden;margin-top:5px;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.track i{display:block;height:100%;border-radius:99px;transition:width .7s cubic-bezier(.2,.9,.3,1.15);background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%)}
.rpct{text-align:right;line-height:1.15}
.rpct b{font-family:var(--f-display);font-size:1.25rem;display:block}
.rpct span{font-size:.72rem;color:var(--muted);font-weight:800;white-space:nowrap;display:block}
.race-msg{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:18px;background:var(--surface-2);font-family:var(--f-display);font-weight:600;font-size:1.12rem}
.race-msg img{width:42px;height:42px;flex:none}
.invite-box{border-radius:20px;padding:14px;background:linear-gradient(135deg, color-mix(in srgb, var(--wa) 16%, var(--surface)), var(--surface-2));display:flex;flex-direction:column;gap:10px}
.invite-btns{display:flex;gap:8px;flex-wrap:wrap}

/* scores, badges */
.scores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:620px){.scores{grid-template-columns:1fr}}
.score{background:var(--surface);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.score .grade{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:1.55rem;line-height:1.1}
.score .grade img{width:40px;height:40px;flex:none}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:12px 6px;border-radius:20px;background:var(--surface-2)}
.badge img{width:58px;height:58px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.15))}
.badge b{font-size:.86rem;line-height:1.15}
.badge span{font-size:.72rem;color:var(--muted);line-height:1.2}
.badge.got{background:linear-gradient(180deg, color-mix(in srgb, var(--sun) 22%, var(--surface)), var(--surface-2))}
.badge.locked img{filter:grayscale(1) opacity(.3)}
.badge.locked b{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-weight:900;font-size:.8rem;background:var(--surface-2);color:var(--muted)}
.g-ex{background:var(--ok-bg);color:var(--ok)}
.g-vg{background:color-mix(in srgb, var(--sky) 18%, var(--surface));color:var(--sky)}
.g-gd{background:var(--late-bg);color:var(--late)}
.g-kt,.g-ne{background:var(--miss-bg);color:var(--miss)}
.dots{display:flex;gap:5px;justify-content:center}
.dot{width:12px;height:12px;border-radius:50%;background:var(--none);display:inline-block}
.dot.p{background:var(--ok)} .dot.l{background:var(--late)} .dot.m{background:var(--miss)} .dot.e{background:var(--exc)}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cal-nav{display:flex;gap:6px}
.cal-nav button{background:var(--surface-2);border:none;border-radius:14px;width:42px;height:42px;font-size:1.3rem;font-weight:900;box-shadow:0 3px 0 var(--line)}
.cal-nav button:disabled{opacity:.35;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{font-size:.76rem;font-weight:900;text-align:center;color:var(--muted)}
.cell{background:var(--surface-2);border:2px solid transparent;border-radius:14px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px;position:relative}
.cell .d{font-weight:900;font-size:.95rem;line-height:1}
.cell .dots{gap:2px;flex-wrap:wrap}
.cell .dot{width:6px;height:6px}
.cell .cstar{position:absolute;top:-6px;right:-4px;width:20px;height:20px}
.cell.today{border-color:var(--accent)}
.cell.sel{border-color:var(--grape);background:var(--surface)}
.cell.full{background:var(--ok-bg)}
.cell.future{opacity:.4;cursor:default}
.cell.blank{background:transparent}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:.82rem;color:var(--muted);font-weight:800}
.legend span{display:inline-flex;align-items:center;gap:6px}
.hist,.guide{width:100%;border-collapse:collapse;font-size:.92rem}
.hist td,.guide td{padding:9px 4px;border-bottom:2px solid var(--surface-2)}
.hist td:last-child,.guide td:last-child{text-align:right}
.guide td:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.hist button{background:none;border:none;font-weight:900;text-decoration:underline;padding:0}
.tbl-wrap{overflow-x:auto}

/* grown-up mode */
.parent-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px 8px 14px;border-radius:18px;background:color-mix(in srgb, var(--grape) 14%, var(--surface));outline:3px solid var(--grape)}
.parent-bar .grow{flex:1;min-width:180px}
.role-seg{align-self:stretch;display:flex}.role-seg button{flex:1;padding:9px 10px;font-size:.92rem}
.pg-today{display:flex;flex-direction:column;gap:8px}
.pg-chips{display:flex;flex-wrap:wrap;gap:6px}
.pg-chip{border-radius:99px;padding:5px 11px;font-weight:800;font-size:.84rem;background:var(--surface-2);color:var(--muted);border:2px solid transparent}
.pg-chip.s-p{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)} .pg-chip.s-l{background:var(--late-bg);border-color:var(--late);color:var(--ink)}
.pg-chip.s-m{background:var(--miss-bg);border-color:var(--miss);color:var(--ink)} .pg-chip.s-e{background:var(--exc-bg);border-color:var(--exc);color:var(--ink)}
.pg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pg-tile{background:var(--surface-2);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.pg-tile .grade{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:700;font-size:1.05rem;line-height:1.15}
.pg-tile .grade img{width:28px;height:28px;flex:none}
.pb-badge{background:var(--grape);color:#fff;font-weight:900;font-size:.8rem;padding:3px 11px;border-radius:99px}
.parent-panel{outline:3px solid var(--grape)}
.check-list{display:flex;flex-direction:column;gap:6px}
.check-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px;align-items:center;padding:6px 8px 6px 12px;background:var(--surface-2);border-radius:14px}

/* themes the child picks (html[data-theme]); "day" keeps the live sky */
:root[data-theme="ocean"]{--sky-a:#075985;--sky-b:#1C9BC9;--sky-c:#8EE3EF;--sky-ink:#FFFFFF;--star-o:0;--accent:#D9434F;--accent-dk:#AA2D37;--grape:#1C7FB6;--grape-dk:#13618C}
:root[data-theme="candy"]{--sky-a:#F25C9F;--sky-b:#FF9CCB;--sky-c:#FFE0EF;--sky-ink:#4A1036;--star-o:0;--accent:#C92A76;--accent-dk:#9C1E5A;--grape:#A44FCB;--grape-dk:#7F3AA0}
:root[data-theme="jungle"]{--sky-a:#14532D;--sky-b:#2F9E5B;--sky-c:#B8EBA6;--sky-ink:#FFFFFF;--star-o:0;--accent:#C9561A;--accent-dk:#9A4013;--grape:#2F8F5B;--grape-dk:#216B43}
:root[data-theme="space"]{--sky-a:#06061A;--sky-b:#1E1550;--sky-c:#4A2C8A;--sky-ink:#FFFFFF;--star-o:1;--accent:#7C4DEB;--accent-dk:#5B31C4}
@media (prefers-color-scheme: light){
  :root[data-theme="ocean"]{--bg:#ECF7FB;--surface-2:#E3F2F7;--line:#CFE6EE}
  :root[data-theme="candy"]{--bg:#FFF2F8;--surface-2:#FCE6F1;--line:#F5D0E3}
  :root[data-theme="jungle"]{--bg:#EFF8EC;--surface-2:#E3F2DE;--line:#CDE6C5}
  :root[data-theme="space"]{--bg:#F0EEFB;--surface-2:#E8E4FA;--line:#D9D2F3}
}
.sky-btn{position:absolute;top:14px;right:14px;z-index:2;border:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,#fff 30%,transparent)}
.sky-btn img{width:30px;height:30px}
.theme-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.tp{border:3px solid transparent;background:var(--surface-2);border-radius:18px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.tp[aria-pressed="true"]{border-color:var(--accent);background:var(--surface)}
.tp-sw{width:100%;height:64px;border-radius:12px;display:grid;place-items:center}
.tp-sw img{width:40px;height:40px}
.tp b{font-family:var(--f-display);font-weight:700}
.tp > span:last-child{font-size:.72rem;color:var(--muted);line-height:1.2}
.tp-day .tp-sw{background:linear-gradient(90deg,#FFB38A,#7CCBFF 40%,#FF9B57 72%,#1D1B52)}
.tp-ocean .tp-sw{background:linear-gradient(180deg,#075985,#1C9BC9,#8EE3EF)}
.tp-candy .tp-sw{background:linear-gradient(180deg,#F25C9F,#FF9CCB,#FFE0EF)}
.tp-jungle .tp-sw{background:linear-gradient(180deg,#14532D,#2F9E5B,#B8EBA6)}
.tp-space .tp-sw{background:linear-gradient(180deg,#06061A,#1E1550,#4A2C8A)}

/* prayer reward */
.reward-card .rw-big{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.rw-amt{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1}
.rw-track{height:18px}
.rw-bonus{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:14px;background:color-mix(in srgb, var(--sun) 18%, var(--surface));font-weight:800}
.rw-bonus img{width:28px;height:28px;flex:none}
.field select{font:inherit;padding:11px 13px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.field input[type="number"]{min-height:46px}

/* badge certificates */
button.badge{border:none;font:inherit;color:inherit;cursor:pointer}
.cert-chip{margin-top:3px;font-size:.7rem;font-weight:900;color:var(--accent);background:var(--surface);padding:1px 9px;border-radius:99px}
.cert-preview{border-radius:16px;overflow:hidden;background:var(--surface-2);min-height:160px;display:grid;place-items:center}
.cert-preview img{width:100%;display:block}
.modal:has(.cert-modal){max-width:760px}

/* buddy chat */
.modal:has(.chat-modal){max-width:520px}
.chat-list{display:flex;flex-direction:column;gap:6px;height:min(48vh,420px);overflow-y:auto;padding:10px;border-radius:16px;background:var(--surface-2)}
.bubble{align-self:flex-start;max-width:80%;background:var(--surface);border-radius:16px 16px 16px 4px;padding:7px 11px;display:flex;flex-direction:column;gap:1px;box-shadow:0 1px 0 var(--line);overflow-wrap:anywhere}
.bubble.mine{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-radius:16px 16px 4px 16px}
.bubble .time{font-size:.66rem;opacity:.75;align-self:flex-end}
.chat-quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chat-quick .mini{white-space:nowrap;padding:4px 10px}
.chat-send{display:flex;gap:8px}
.chat-input{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.chat-row{border:none;width:100%;font:inherit;color:inherit;cursor:pointer}
.chat-prev{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-dot{width:12px;height:12px;border-radius:50%;background:var(--accent);flex:none}
.nudge-btn{position:relative}
.nudge-btn.has-dot::after{content:"";position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:50%;background:var(--accent)}

/* new games */
.rps{display:flex;flex-direction:column;gap:16px;align-items:center}
.rps-arena{display:flex;align-items:center;justify-content:center;gap:18px}
.rps-hand{width:120px;height:130px;border-radius:24px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.rps-hand img{width:76px;height:76px;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.rps-q{font-family:var(--f-display);font-size:3rem;font-weight:800;color:var(--muted);line-height:1}
.rps-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:420px}
.rps-btn{border:none;background:var(--surface);border-radius:20px;padding:10px 4px;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:4px}
.rps-btn img{width:56px;height:56px}
.rps-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.words{display:flex;flex-direction:column;gap:16px;align-items:center}
.balloons{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:66px}
.balloon img{width:44px;height:60px;object-fit:contain;filter:hue-rotate(var(--h));animation:bob 3s ease-in-out infinite}
.balloon:nth-child(2n) img{animation-delay:-1.4s}
.balloon.popped img{opacity:0;animation:popb .35s ease-in}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes popb{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.7)}}
.word{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.slot{width:36px;height:46px;border-bottom:4px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.7rem}
.slot.on{border-color:var(--ok)}
.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:100%;max-width:440px}
.key{border:none;border-radius:12px;background:var(--surface);box-shadow:0 3px 0 var(--line);padding:9px 0;font-weight:900;font-size:1.05rem}
.key.hit{background:var(--ok);color:#fff;box-shadow:none}
.key.miss{background:var(--surface-2);color:var(--muted);box-shadow:none;text-decoration:line-through}
.quiz{display:flex;flex-direction:column;gap:12px}
.quiz-q{font-family:var(--f-display);font-weight:700;font-size:1.45rem;line-height:1.2;text-align:center;text-wrap:balance}
.quiz-opts{display:grid;gap:8px}
.quiz-opt{border:3px solid transparent;background:var(--surface);border-radius:18px;padding:13px 14px;font-weight:900;font-size:1.05rem;box-shadow:0 4px 0 var(--line);text-align:left}
.quiz-opt.right{border-color:var(--ok);background:var(--ok-bg)}
.quiz-opt.wrong{border-color:var(--miss);background:var(--miss-bg)}
.quiz-opt:disabled{cursor:default;color:inherit}
.quiz-timer{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.quiz-timer i{display:block;height:100%;background:var(--sun);animation:shrink linear forwards}
@keyframes shrink{from{width:100%}to{width:0}}
.quiz-end{display:grid;place-items:center}.quiz-end img{width:140px;height:140px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}

/* bottom navigation bar (Material 3 style): Prayers, Buddies, Games, Me */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:12;display:grid;grid-template-columns:repeat(2,1fr);gap:2px;
  padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb, var(--surface) 90%, transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 -1px 0 var(--line), 0 -12px 30px -22px rgba(34,32,74,.55)}
.tab{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 0;color:var(--muted);font-weight:800;font-size:.78rem}
.tab-ic{position:relative;width:64px;height:34px;border-radius:99px;display:grid;place-items:center;transition:background .25s}
.tab-ic img{width:28px;height:28px;transition:transform .25s}
.tab.on{color:var(--ink);font-weight:900}
.tab.on .tab-ic{background:color-mix(in srgb, var(--accent) 18%, var(--surface))}
.tab.on .tab-ic img{transform:scale(1.12)}

// ---------- dom helpers ----------
function el(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "style") e.style.cssText = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}

function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.getElementById("confetti"), ctx = c.getContext("2d");
  c.hidden = false; c.width = innerWidth; c.height = innerHeight;
  const cols = ["#FF5C8A","#FFC23C","#3E9BFF","#17A35F","#7C5CFF"];
  const ps = Array.from({length:140}, () => ({x:innerWidth/2, y:innerHeight/3, vx:(Math.random()-.5)*15, vy:Math.random()*-13-3, r:Math.random()*7+4, c:cols[Math.random()*cols.length|0], a:Math.random()*6, s:Math.random()>.5}));
  let f = 0;
  (function tick(){
    ctx.clearRect(0,0,c.width,c.height);
    for (const p of ps){ p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .2; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
      if (p.s) ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); else { ctx.beginPath(); ctx.arc(0,0,p.r/2.4,0,7); ctx.fill(); } ctx.restore(); }
    if (++f < 120) requestAnimationFrame(tick); else { ctx.clearRect(0,0,c.width,c.height); c.hidden = true; }
  })();
}

    const first = !me;

    if (me.theme && THEMES[me.theme]) applyTheme(me.theme);
    syncRacers(); chat?.sync();

    checkBadges(); checkPet();
    if (first){

  sub("reward", () => onSnapshot(doc(db, "users", uid, "private", "reward"), s => { reward = s.exists() ? s.data() : null; render(); }, () => {}));

// Grown-up view: load the child's months one by one (a grown-up login opens single months; it can't search them).
function watchKidMonths(uid){
  const start = (me.joined || me.created || todayStr()).slice(0,7), list = [];
  for (let ym = thisYM(); ym >= start && list.length < 24; ){ list.push(ym); const d = parse(ym + "-01"); d.setMonth(d.getMonth() - 1); ym = ymd(d).slice(0,7); }
  let left = list.length;
  for (const ym of list) sub(`pm:${ym}`, () => onSnapshot(doc(db, "marks", `${uid}_${ym}`), s => {
    if (s.exists()) marks.set(s.id, structuredClone(s.data()));
    if (--left <= 0) marksLoaded = true;
    if (marksLoaded) publishScore();
    render();
  }, () => {}));
}
// Make (or update) the grown-up login for a child. Runs in a second, hidden session so the child stays logged in.
async function linkParentLogin(kid, pin, oldPin){
  if (asParent || !kid?.uid || !kid?.username || !fbCfg) return false;
  try {
    helperAuth ||= getAuth(initializeApp(fbCfg, "grown-up-helper"));
    const email = parentEmail(kid.username); let cred = null;
    try { cred = await signInWithEmailAndPassword(helperAuth, email, parentPass(pin)); } catch {}
    if (!cred && oldPin && oldPin !== pin){
      try { cred = await signInWithEmailAndPassword(helperAuth, email, parentPass(oldPin)); await updatePassword(cred.user, parentPass(pin)); } catch { cred = null; }
    }
    if (!cred){ try { cred = await createUserWithEmailAndPassword(helperAuth, email, parentPass(pin)); } catch { return false; } }
    if (cred.user.displayName !== kid.uid) await updateProfile(cred.user, {displayName:kid.uid});
    if (people.get(kid.uid)?.parent !== cred.user.uid) await updateDoc(doc(db, "users", kid.uid), {parent:cred.user.uid});
    await signOut(helperAuth);
    return true;
  } catch { return false; }
}
// Racers: subscribe to each friend's profile and their this-month + last-month ticks.
function syncRacers(){
  const want = new Set(me.friends || []);
  for (const key of [...subs.keys()]) if (key.startsWith("f:")) { const fuid = key.split(":")[1]; if (!want.has(fuid)) { unsub(key); people.delete(fuid); } }
  for (const fuid of want){
    sub(`f:${fuid}:profile`, () => onSnapshot(doc(db, "users", fuid), s => { if (s.exists()) { people.set(fuid, {uid:fuid, ...s.data()}); render(); } }, () => {}));
    for (const ym of [thisYM(), prevYM()])
      sub(`f:${fuid}:${ym}`, () => onSnapshot(doc(db, "marks", `${fuid}_${ym}`), s => { if (s.exists()) { marks.set(s.id, s.data()); render(); } }, () => {}));
  }
}

function raceBoard(){

  if (racing){
    const ahead = rows.filter(r => r.points > mine.points).sort((a,b)=>a.points-b.points);
    const tied = rows.filter(r => r.uid !== me.uid && mine.points > 0 && r.points === mine.points);
    if (!mine.points) msg = ["flag", mine.pending ? `You have ${mine.pending} prayer${mine.pending>1?"s":""} waiting. Ask a grown-up to confirm them to get on the board!` : requireConfirm ? "You're not on the board yet. Tick your prayers and ask a grown-up to confirm them!" : "You're not on the board yet. Tick your prayers to collect points!"];
    else if (!ahead.length && tied.length) msg = ["medal1", `You're tied for 1st with ${tied.map(t=>t.p.name).join(" and ")}!`];
    else if (!ahead.length) msg = ["trophy", "You're in 1st place! Everyone is chasing you!"];
    else msg = ["rocket", `You're ${ordinal(mine.place)}. ${ahead[0].p.name} is just ${fmtPts(ahead[0].points - mine.points)} point${ahead[0].points - mine.points === 1 ? "" : "s"} ahead. Catch up!`];
  }
  const share = async () => {
    try { await navigator.share({title:"Salah Tracker", text:inviteText().replace(inviteLink(),"").trim(), url:inviteLink()}); }
    catch (e) { if (e?.name !== "AbortError") copyLink(); }
  };
  const copyLink = async () => {
    try { await navigator.clipboard.writeText(inviteLink()); toast("Invite link copied!", "check"); }
    catch { modal(close => el("div",{class:"stack"}, el("h2",{},"Your invite link"), el("input",{value:inviteLink(), readonly:true, style:"font:inherit;padding:10px;border-radius:12px;border:2px solid var(--line);width:100%", onfocus:e=>e.target.select()}), el("div",{class:"actions"}, el("button",{class:"btn primary", onclick:close},"Done")))); }

// Days a grown-up still needs to look at: unapproved days (last 31) with Prayed or Late ticks.
// Missed/Excused need no approval, so days with only those never show up here.
function toCheck(){
  const today = todayStr(), out = [];
  let from = addDays(today, -30); const start = firstDate(me.uid); if (start > from) from = start;
  for (let d = from; d <= today; d = addDays(d,1)) if (unapprovedTicks(me.uid, d).length) out.push(d);
  return out.reverse();
}

    pinButtons());
  const days = toCheck(), qz = pendingQaza(me.uid);
  const pname = k => PRAYERS.find(p => p.k === k)?.en || k;

      days.length > 1 ? el("button",{class:"btn approve sm", onclick:()=>{ approveDays(days); toast(`${days.length} days confirmed`,"check"); }}, `Confirm all ${days.length}`) : null),
    days.length ? el("div",{class:"check-list"}, days.map(d => el("div",{class:"check-row"},

function agoText(ms){
  const m = Math.round((Date.now() - ms) / 60000);
  if (m < 2) return "just now"; if (m < 60) return `${m} minutes ago`;
  const h = Math.round(m / 60); if (h < 24) return `${h} hour${h > 1 ? "s" : ""} ago`;
  const d = Math.round(h / 24); return d === 1 ? "yesterday" : `${d} days ago`;
}

function renderCalendar(){
  const uid = me.uid, y = view.calY, m = view.calM, today = todayStr();
  const first = new Date(y, m, 1), days = new Date(y, m+1, 0).getDate();
  const [ms, me2] = monthBounds(y, m);
  const now = new Date(), atCurrent = y === now.getFullYear() && m === now.getMonth();
  const cells = [];
  for (let i=0;i<first.getDay();i++) cells.push(el("div",{class:"cell blank", "aria-hidden":"true"}));
  for (let d=1; d<=days; d++){
    const s = ymd(new Date(y, m, d)), st = dayStatuses(uid, s), future = s > today, full = fullDay(st) && !future;
    cells.push(el("button",{
      class:`cell ${s===today?"today":""} ${s===view.sel?"sel":""} ${future?"future":""} ${full?"full":""}`,
      disabled: future, "aria-label": `${prettyDate(s)}${future?"":`, ${prayedCount(st)} prayed`}`,
      onclick:()=>{ view.sel = s; render(); document.getElementById("day")?.scrollIntoView({behavior:"smooth"}); }
    }, full ? img("star","cstar") : null, el("span",{class:"d num"}, d), future ? null : dots(st)));
  }
  const shift = n => { const d = new Date(view.calY, view.calM + n, 1); view.calY = d.getFullYear(); view.calM = d.getMonth(); render(); };
  return el("section",{class:"panel", id:"calendar"},
    el("div",{class:"cal-head"},
      el("div",{class:"sec-title"}, img("p-dhuhr"), el("div",{}, el("h2",{}, monthName(y, m)), el("div",{style:"margin-top:4px"}, gradeChip(score(uid, ms, me2)?.pct ?? null)))),
      el("div",{class:"cal-nav"},
        el("button",{onclick:()=>shift(-1), "aria-label":"Previous month"},"‹"),
        el("button",{onclick:()=>shift(1), "aria-label":"Next month", disabled:atCurrent},"›"))),
    el("div",{class:"cal"}, WEEKDAYS.map(w => el("div",{class:"wd"}, w)), cells),
    el("div",{class:"legend"},
      el("span",{}, el("i",{class:"dot p"}), "On time"), el("span",{}, el("i",{class:"dot l"}), "Late"),
      el("span",{}, el("i",{class:"dot m"}), "Missed"), el("span",{}, el("i",{class:"dot e"}), "Excused"),
      el("span",{}, el("i",{class:"dot"}), "Not ticked")),
    el("p",{class:"small muted", style:"margin-top:8px"},"A star means all 5 prayers were done that day. Tap any past day to see or fix it."));
}

// ---------- account actions ----------

  games?.stop(); nudges?.stop(); petShown = null; unsubAll(); me = null; people.clear(); marks.clear(); parentMode = false; parentHash = null;
  asParent = false; parentLinkBad = false; parentPinPlain = null; marksLoaded = false; reward = null; chat?.stop();
  view = {sel:null, calY:0, calM:0, authTab:"login", editRace:false, loginAs:view.loginAs};
  await signOut(auth); render(); scrollTo(0,0);
}

      el("div",{class:"actions"}, el("button",{type:"button", class:"btn ghost", onclick:close},"Cancel"), save));

function pinForm({title, intro, confirm, label, submitLabel, onOk}){
  modal(close => {
    const pin = pinInput("pf-pin"), pin2 = confirm ? pinInput("pf-pin2") : null;
    const err = el("div",{class:"err"});
    const form = el("form",{class:"stack", onsubmit: async e => {
      e.preventDefault();
      if (!/^\d{4}$/.test(pin.value)) return err.textContent = "The PIN needs exactly 4 numbers.";
      if (confirm && pin.value !== pin2.value) return err.textContent = "The two PINs don't match.";
      const m = await onOk(pin.value);
      if (m){ err.textContent = m; pin.value = ""; if (pin2) pin2.value = ""; pin.focus(); } else close();
    }},
      el("div",{class:"sec-title"}, img("lock"), el("h2",{}, title)), el("p",{class:"small muted"}, intro),
      el("div",{class:"field"}, el("label",{for:"pf-pin"}, label), pin),
      confirm ? el("div",{class:"field"}, el("label",{for:"pf-pin2"},"Type it again"), pin2) : null,
      err,
      el("div",{class:"actions"}, el("button",{type:"button", class:"btn ghost", onclick:close},"Cancel"), el("button",{class:"btn primary", type:"submit"}, submitLabel)));
    if (!confirm) pin.addEventListener("input", () => { if (pin.value.length === 4) form.requestSubmit(); });
    return form;
  });
}
async function loadParentHash(){

  return parentHash = s.exists() ? s.data().parentPinHash : null;

async function openParent(){

  pinForm({title:"Grown-up check", intro:"Parents can confirm their child's prayers, fix ticks and change PINs.", label:"Grown-up PIN", submitLabel:"Open",

document.addEventListener("visibilitychange", () => { if (document.visibilityState !== "visible") return; paintHeaderDates(); if (me){ refreshTimes(true); if (!$modal.firstChild) render(); } });
try {
  const cfg = await fetch("/__/firebase/init.json").then(r => { if (!r.ok) throw 0; return r.json(); });
  const app = initializeApp(cfg); fbCfg = cfg;
  auth = getAuth(app); db = getFirestore(app);
  nudges = initNudges({app, dbURL: cfg.databaseURL || "https://family-salah-tracker-765ed-default-rtdb.europe-west1.firebasedatabase.app", me:() => me, people, el, img, avatar, toast, modal, rerender:() => render()});
  games = initGames({app, dbURL: cfg.databaseURL || "https://family-salah-tracker-765ed-default-rtdb.europe-west1.firebasedatabase.app",
    me: () => me, people, el, img, avatar, toast, confetti, rerender: () => render()});
  refreshTimes();
  chat = initChat({db, fs:{collection, query, orderBy, limit, onSnapshot, addDoc, serverTimestamp}, me:() => me, people, el, img, avatar, toast, modal,
    rerender:() => { if (!$modal.firstChild) render(); }, enabled:() => !chatOff, readOnly:() => asParent});
  onSnapshot(doc(db, "config", "app"), s => { requireConfirm = !!s.data()?.requireConfirm; chatOff = !!s.data()?.chatOff; chat?.sync(); if (me){ publishScore(); render(); } }, () => {});
  if (location.pathname.startsWith("/admin")){
    document.getElementById("guide-fab").hidden = true;
    const { startAdmin } = await import("/admin.js");
    startAdmin({auth, db, el, img, avatar, toast, $app});
  } else onAuthStateChanged(auth, user => {
    if (user && !me) startSession(user);
    render();
  });
} catch {
  show(el("div",{class:"panel"}, el("h2",{},"Almost ready"), el("p",{class:"muted", style:"margin-top:6px"},"This site needs to be opened from its web address after it's been uploaded to Firebase.")));
}
